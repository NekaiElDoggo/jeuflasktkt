<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Gacha Prototype</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
  <h1>Gacha Prototype</h1>
  <div id="auth">
    <h3>Register</h3>
    <input id="reg_user" placeholder="username">
    <input id="reg_pass" placeholder="password" type="password">
    <button id="reg_btn">Register</button>
    <h3>Login</h3>
    <input id="login_user" placeholder="username">
    <input id="login_pass" placeholder="password" type="password">
    <button id="login_btn">Login</button>
    <div id="user_status"></div>
  </div>

  <p>Quick links:</p>
  <a href="/pool/standard">Open standard pool</a> | <a href="/inventory">Inventory</a> | <a href="/admin/items">Admin API</a>

  <script src="/static/js/gacha.js"></script>
  <script>
    // auth handlers
    document.getElementById('reg_btn').onclick = async () => {
      const username = document.getElementById('reg_user').value
      const password = document.getElementById('reg_pass').value
      const r = await fetch('/api/register', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username, password})})
      document.getElementById('user_status').innerText = (await r.json()).username || JSON.stringify(await r.json())
    }
    document.getElementById('login_btn').onclick = async () => {
      const username = document.getElementById('login_user').value
      const password = document.getElementById('login_pass').value
      const r = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({username, password})})
      document.getElementById('user_status').innerText = (await r.json()).username || JSON.stringify(await r.json())
    }
  </script>
</body>
</html>
