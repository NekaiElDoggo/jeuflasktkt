<!doctype html>
<html>
<head><meta charset="utf-8"><title>Admin</title><link rel="stylesheet" href="/static/css/main.css"></head>
<body>
  <h1>Admin Items</h1>
  <div id="admin_status"></div>
  <div>
    <input id="item_name" placeholder="name"><input id="item_rarity" placeholder="rarity"><label>featured<input id="item_featured" type="checkbox"></label>
    <button id="add_item">Add</button>
  </div>
  <div id="items"></div>
  <script>
    async function loadItems(){
      const r = await fetch('/admin/items');
      if (r.status===403){document.getElementById('admin_status').innerText='Forbidden (login as admin)'; return}
      const data = await r.json();
      document.getElementById('items').innerHTML = data.items.map(i=>`<div>${i.id}: ${i.name} (${i.rarity}★) ${i.is_featured?'<strong>FEATURED</strong>':''} <button data-id="${i.id}" class="del">Del</button></div>`).join('')
      document.querySelectorAll('.del').forEach(b=>b.onclick=async ()=>{const id=b.dataset.id; await fetch('/admin/items', {method:'DELETE', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id})}); loadItems()})
    }
    document.getElementById('add_item').onclick = async ()=>{
      const name = document.getElementById('item_name').value
      const rarity = parseInt(document.getElementById('item_rarity').value||3)
      const is_featured = document.getElementById('item_featured').checked
      const r = await fetch('/admin/items', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({name, rarity, is_featured})})
      loadItems()
    }
    loadItems()
  </script>
</body>
</html>
