<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Inventory</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
  <h1>Inventory</h1>
  <div id="user_status">Loading...</div>
  <div id="inventory"></div>
  <script>window.PULL_COST = {{ config.get('PULL_COST', 100) }};</script>
  <script src="/static/js/gacha.js"></script>
  <script>
    // load inventory
    window.onload = () => {
      fetch('/api/inventory').then(r => r.json()).then(data => {
        const inv = document.getElementById('inventory')
        if (data.inventory) {
          inv.innerHTML = data.inventory.map(i => `<div>${i.name} (${i.rarity}★) x${i.count}</div>`).join('')
        } else {
          inv.innerText = 'Not authenticated or empty.'
        }
      })
    }
  </script>
</body>
</html>
